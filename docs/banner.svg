<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bar { transform-origin: center 210px; animation: grow 5s ease-in-out infinite; }
    .b1 { animation-delay: 0s; } .b2 { animation-delay: .15s; } .b3 { animation-delay: .3s; }
    .b4 { animation-delay: .45s; } .b5 { animation-delay: .6s; } .b6 { animation-delay: .75s; }
    @keyframes grow { 0% { transform: scaleY(0); } 14% { transform: scaleY(1); } 82% { transform: scaleY(1); } 94% { transform: scaleY(0); } 100% { transform: scaleY(0); } }
    .spark { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 5s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 420; } 30% { stroke-dashoffset: 0; } 82% { stroke-dashoffset: 0; } 95% { stroke-dashoffset: 420; } 100% { stroke-dashoffset: 420; } }
    .donut { stroke-dasharray: 0 302; animation: sweep 5s ease-in-out infinite; transform: rotate(-90deg); transform-origin: 1108px 130px; }
    @keyframes sweep { 0% { stroke-dasharray: 0 302; } 30% { stroke-dasharray: 220 302; } 82% { stroke-dasharray: 220 302; } 95% { stroke-dasharray: 0 302; } 100% { stroke-dasharray: 0 302; } }
    .pulse { animation: pulse 5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  </style>
  <rect width="1200" height="260" rx="14" fill="#0b1020"/>
  <rect width="1200" height="260" rx="14" fill="url(#g)" opacity=".55"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#0b1020" stop-opacity="0"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity=".18"/>
    </linearGradient>
  </defs>
  <text x="64" y="108" fill="#f8fafc" font-size="44" font-weight="700">Sales &amp; Marketing</text>
  <text x="64" y="158" fill="#93c5fd" font-size="44" font-weight="700">Analytics Dashboards</text>
  <text x="64" y="200" fill="#94a3b8" font-size="19">8 interactive demos &#183; vanilla JS + ECharts &#183; 100% synthetic data</text>
  <g class="pulse"><circle cx="70" cy="52" r="5" fill="#22c55e"/><text x="84" y="58" fill="#86efac" font-size="15">live demo</text></g>
  <g>
    <rect class="bar b1" x="700" y="120" width="30" height="90" rx="4" fill="#3b82f6"/>
    <rect class="bar b2" x="740" y="90"  width="30" height="120" rx="4" fill="#60a5fa"/>
    <rect class="bar b3" x="780" y="140" width="30" height="70" rx="4" fill="#93c5fd"/>
    <rect class="bar b4" x="820" y="70"  width="30" height="140" rx="4" fill="#f59e0b"/>
    <rect class="bar b5" x="860" y="105" width="30" height="105" rx="4" fill="#fbbf24"/>
    <rect class="bar b6" x="900" y="55"  width="30" height="155" rx="4" fill="#fcd34d"/>
    <line x1="690" y1="210" x2="945" y2="210" stroke="#334155" stroke-width="2"/>
    <path class="spark" d="M700 95 L745 70 L790 88 L835 48 L880 62 L928 38" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="1108" cy="130" r="48" fill="none" stroke="#1e293b" stroke-width="16"/>
  <circle class="donut" cx="1108" cy="130" r="48" fill="none" stroke="#3b82f6" stroke-width="16" stroke-linecap="round"/>
  <text x="1108" y="137" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">73%</text>
</svg>
