<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" font-family="Consolas, 'Courier New', monospace">
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .b { transform-origin: center 196px; animation: grow 5s steps(7) infinite; }
    .b2 { animation-delay: .12s; } .b3 { animation-delay: .24s; } .b4 { animation-delay: .36s; }
    .b5 { animation-delay: .48s; } .b6 { animation-delay: .6s; }
    @keyframes grow { 0% { transform: scaleY(0); } 30% { transform: scaleY(1); } 86% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
    .live { animation: blink 2.2s steps(1) infinite; }
  </style>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(248,247,243,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" fill="#0a0a0b"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect x="48" y="40" width="690" height="184" fill="#000000"/>
  <rect x="40" y="32" width="690" height="184" fill="#131316" stroke="rgba(248,247,243,0.10)"/>
  <text x="76" y="80" fill="#8A8A94" font-size="14" letter-spacing="3"><tspan fill="#2563EB">//</tspan> ANALYTICS</text>
  <text x="74" y="130" fill="#F8F7F3" font-size="34" font-weight="700" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Sales &amp; Marketing <tspan fill="#60A5FA">Dashboards</tspan></text>
  <text x="76" y="164" fill="#A1A1AA" font-size="15">8 interactive demos &#183; vanilla js + echarts &#183; synthetic data<tspan class="cursor" fill="#2563EB">_</tspan></text>
  <g font-size="14">
    <rect class="live" x="76" y="182" width="10" height="10" fill="#4ade80"/>
    <text x="94" y="192" fill="#4ade80">live demo</text>
    <text x="196" y="192" fill="#8A8A94">felippeyann.github.io/sales-analytics-dashboards</text>
  </g>
  <g>
    <rect x="806" y="204" width="330" height="2" fill="rgba(248,247,243,0.16)"/>
    <rect class="b"    x="806" y="118" width="38" height="86" fill="#2563EB"/>
    <rect class="b2"   x="854" y="90"  width="38" height="114" fill="#60A5FA"/>
    <rect class="b3"   x="902" y="140" width="38" height="64" fill="#8A8A94"/>
    <rect class="b4"   x="950" y="66"  width="38" height="138" fill="#2563EB"/>
    <rect class="b5"   x="998" y="102" width="38" height="102" fill="#60A5FA"/>
    <rect class="b6"   x="1046" y="52" width="38" height="152" fill="#fbbf24"/>
  </g>
</svg>
